name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            run-clippy: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: ${{ matrix.run-clippy && 'clippy' || '' }}
      - uses: Swatinem/rust-cache@v2
      - if: matrix.run-clippy
        run: cargo clippy -- -D warnings
      - run: cargo test

  coverage:
    name: Coverage
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --workspace

  doc:
    name: Doc
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace

  audit:
    name: Audit
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit

  complexity:
    name: Complexity
    needs: test
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache rust-code-analysis-cli
        id: cache-rca
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/rust-code-analysis-cli
          key: rca-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
      - if: steps.cache-rca.outputs.cache-hit != 'true'
        run: cargo install rust-code-analysis-cli --locked
      - run: rust-code-analysis-cli -m -p crates/ -O json
